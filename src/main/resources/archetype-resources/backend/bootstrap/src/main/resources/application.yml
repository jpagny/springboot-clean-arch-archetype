server:
  port: 0

spring:
  application:
    name: ${artifactId}

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
