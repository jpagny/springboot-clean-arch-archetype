######################################################################
# 1?? MESSAGES PAR DÉFAUT / FALLBACK
# --------------------------------------------------------------------
# Utilisés comme messages par défaut lorsqu'aucune clé localisée
# n'est trouvée dans les fichiers i18n.
######################################################################
example.unknown=Propri\u00E9t\u00E9 inconnue


######################################################################
# 2?? MESSAGES MÉTIER (SUCCÈS)
# --------------------------------------------------------------------
# Messages retournés lors de scénarios métier réussis :
# création, mise à jour, suppression, etc.
######################################################################
example.example_created=Exemple {0} cr\u00E9\u00E9 avec succ\u00E8s !


######################################################################
# 3?? ERREURS MÉTIER
# --------------------------------------------------------------------
# Erreurs métier spécifiques au module "example".
# Ces messages remplacent ou complètent les erreurs globales.
######################################################################
error.example.conflict=Un exemple nomm\u00E9 \u00AB {0} \u00BB existe d\u00E9j\u00E0.
error.example.forbidden=Nom interdit.
