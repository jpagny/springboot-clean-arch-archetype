services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${APP_NAME:-app}-backend:${APP_TAG:-local}
    container_name: ${APP_NAME:-app}-backend

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"

    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
